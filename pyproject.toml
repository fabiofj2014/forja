[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forja"
version = "0.1.0"
description = "Plugin que integra GitHub Spec-Kit + Ralph Loop + Autoresearch num pacote instalável para agentes de IA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fabio FJ" }]
keywords = ["ai", "agent", "claude", "codex", "opencode", "automation"]
dependencies = []

[project.scripts]
forja = "core.cli:main"

[project.optional-dependencies]
mcp = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
